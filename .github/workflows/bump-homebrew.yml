name: Verify Homebrew Cask

# The clonui cask is on Homebrew's autobump list — BrewTestBot automatically
# creates version-bump PRs every ~3 hours. This workflow only *verifies* that
# the cask has been updated, it no longer submits bump PRs itself.

on:
  # Daily check at 08:00 UTC
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (e.g., 1.8.20). Leave empty to use latest release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-cask:
    name: Verify Homebrew Cask
    runs-on: ubuntu-latest

    steps:
      - name: Get expected version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            # Fetch latest non-prerelease release tag. Soft-skip when the repo
            # has no releases yet so scheduled runs stay green.
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq '.tagName' 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "::notice::No GitHub release found yet — skipping Homebrew cask verify."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            VERSION="${TAG#v}"
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected Homebrew cask version: $VERSION"

      - name: Verify cask version
        id: verify
        if: steps.release.outputs.skip != 'true'
        run: |
          EXPECTED="${{ steps.release.outputs.version }}"

          # Fetch the cask file directly from the Homebrew repo
          CASK_CONTENT=$(curl -fsSL "https://raw.githubusercontent.com/Homebrew/homebrew-cask/HEAD/Casks/a/clonui.rb" 2>/dev/null || echo "")

          if [ -z "$CASK_CONTENT" ]; then
            echo "::error::Failed to fetch cask file from Homebrew repo"
            echo "status=fetch_failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Extract version from cask file
          CASK_VERSION=$(echo "$CASK_CONTENT" | grep -oP 'version\s+"\K[^"]+' | head -1)
          echo "  Expected: $EXPECTED"
          echo "  Homebrew: $CASK_VERSION"
          echo "cask_version=$CASK_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CASK_VERSION" = "$EXPECTED" ]; then
            echo "status=match" >> "$GITHUB_OUTPUT"
          else
            echo "status=mismatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for pending PR
        if: steps.release.outputs.skip != 'true' && steps.verify.outputs.status == 'mismatch'
        id: check_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED="${{ steps.release.outputs.version }}"
          # Look for an open BrewTestBot PR that bumps to this version
          PR_URL=$(gh search prs --repo Homebrew/homebrew-cask --author BrewTestBot --state open "clonui $EXPECTED" --json url --jq '.[0].url // empty' 2>/dev/null || echo "")
          if [ -n "$PR_URL" ]; then
            echo "pending_pr=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "Found pending BrewTestBot PR: $PR_URL"
          else
            echo "pending_pr=" >> "$GITHUB_OUTPUT"
            echo "No pending BrewTestBot PR found for clonui $EXPECTED"
          fi

      - name: Report result
        if: always()
        run: |
          if [ "${{ steps.release.outputs.skip }}" = "true" ]; then
            echo "Result: skipped (no release yet)"
            exit 0
          fi
          STATUS="${{ steps.verify.outputs.status }}"
          EXPECTED="${{ steps.release.outputs.version }}"
          ACTUAL="${{ steps.verify.outputs.cask_version }}"
          PENDING="${{ steps.check_pr.outputs.pending_pr }}"
          echo "Result: $STATUS (expected=$EXPECTED homebrew=$ACTUAL pending=$PENDING)"
          if [ "$STATUS" = "fetch_failed" ]; then
            exit 1
          fi
          # mismatch is informational while BrewTestBot catches up — do not fail the job
          exit 0
